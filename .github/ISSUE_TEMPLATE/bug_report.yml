name: Bug report
description: Report a reproducible problem with earshot
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private audio, transcripts and model files from your report.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: earshot version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04, RTX 3070, CUDA 12.x
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and relevant output
      render: shell
    validations:
      required: true
